name: Agri Ledger Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - "firebase.rules.json"
      - "database.rules.json"
      - "test/firebase-rules.test.mjs"
      - ".github/workflows/firebase-ci.yml"
  pull_request:
    paths:
      - "firebase.rules.json"
      - "database.rules.json"
      - "test/firebase-rules.test.mjs"
      - ".github/workflows/firebase-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agri-ledger-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Database Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator test dependencies
        run: npm install --no-save --no-audit --no-fund firebase@latest @firebase/rules-unit-testing@latest firebase-tools@15.28.1
      - name: Validate rules files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.rules.json', 'utf8'))"
          cmp -s firebase.rules.json database.rules.json
          node --check test/firebase-rules.test.mjs
      - name: Run Database Rules emulator tests
        run: npx --no-install firebase emulators:exec --only database --project agri-ledger-rules-test "node test/firebase-rules.test.mjs"

  deploy-rules:
    name: Deploy Realtime Database Rules
    needs: rules-tests
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install --no-save --no-audit --no-fund firebase-tools@15.28.1
      - name: Verify Firebase token is configured
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo 'FIREBASE_TOKEN is not configured in the production environment.'
            exit 1
          fi
      - name: Deploy Realtime Database Rules only
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --no-install firebase deploy --only database --project smart-farm-platfor --token "$FIREBASE_TOKEN" --non-interactive
