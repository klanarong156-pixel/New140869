name: Smart Farm quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    name: Web syntax and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
          for file in *.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"; done
      - name: Validate referenced local assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            grep -oE '(src|href)="[^"]+"' "$file" | cut -d'"' -f2 | grep -vE '^(https?:|#|data:|mailto:|/)' | while IFS= read -r ref; do
              local_ref="${ref%%\?*}"
              local_ref="${local_ref%%\#*}"
              test -e "$local_ref" || { echo "$file -> $ref (MISSING)"; exit 1; }
            done
          done < <(find . -maxdepth 1 -name '*.html' -print)
          test -f icon-512.png
          test "$(file icon-512.png | grep -c '512 x 512')" -eq 1
      - name: Check whitespace
        run: git diff --check

  firmware-build:
    name: ESP8266 firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile with Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
      - name: Install libraries
        run: |
          arduino-cli lib install 'WiFiManager@2.0.17'
          arduino-cli lib install 'PubSubClient@2.8'
          arduino-cli lib install 'ArduinoJson@7.4.3'
          arduino-cli lib install 'NTPClient@3.2.1'
          arduino-cli lib install 'RTClib@2.1.4'
          arduino-cli lib install 'DHT sensor library@1.4.7'
          arduino-cli lib install 'Adafruit Unified Sensor'
      - name: Compile firmware
        run: |
          mkdir -p /tmp/smartfarm-sketch
          cp SmartFarm_V6_PRODUCTION.ino /tmp/smartfarm-sketch/smartfarm-sketch.ino
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir build /tmp/smartfarm-sketch
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFarm-V7-ESP8266-BIN
          path: build/*.bin
