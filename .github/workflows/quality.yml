name: Smart Farm quality
# Current architecture: mqtt-connection.js + SmartFarm_V7.2.0_OTA_STABLE.ino

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Web syntax and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.mjs dashboard/*.js control-room/*.js tools/*.mjs; do node --check "$file"; done
          for file in *.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"; done
      - name: Run Smart Farm contract checks
        run: |
          node dashboard-smoke-test.mjs
          node dashboard-contract-test.mjs
          node firmware-v720-contract-test.mjs
          node dashboard-layout-audit.mjs
          node schedule-regression-test.mjs
          node firmware-logic-regression-test.mjs
          node ai-advisor-regression-test.mjs
          python3 tools/mqtt_contract_audit.py
      - name: Run E2E navigation checks
        run: node e2e-navigation-test.mjs
      - name: Validate referenced local assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            refs=$(grep -oE '(src|href)="[^"]+"' "$file" || true)
            while IFS= read -r ref; do
              [[ -z "$ref" ]] && continue
              [[ "$ref" == *.svg#* ]] && continue
              local_ref="${ref%%\?*}"
              local_ref="${local_ref%%\#*}"
              test -e "$local_ref" || { echo "$file -> $ref (MISSING)"; exit 1; }
            done < <(printf '%s\n' "$refs" | cut -d'"' -f2 | grep -vE '^(https?:|#|data:|mailto:|/)' | grep -vE '\.svg#' || true)
          done < <(find . -maxdepth 1 -name '*.html' -print)
          while IFS= read -r file; do
            refs=$(grep -oE '(src|href)="[^"]+"' "$file" || true)
            while IFS= read -r ref; do
              [[ -z "$ref" ]] && continue
              [[ "$ref" == *.svg#* ]] && continue
              local_ref="${ref%%\?*}"
              local_ref="${local_ref%%\#*}"
              local_ref="dashboard/${local_ref#../}" # resolve dashboard-relative files below
              if [[ "$ref" == *"../"* ]]; then
                local_ref="${ref%%\?*}"
                local_ref="${local_ref%%\#*}"
              fi
              test -e "dashboard/$local_ref" || test -e "$local_ref" || { echo "$file -> $ref (MISSING)"; exit 1; }
            done < <(printf '%s\n' "$refs" | cut -d'"' -f2 | grep -vE '^(https?:|#|data:|mailto:|/)' | grep -vE '\.svg#' || true)
          done < <(find dashboard -maxdepth 1 -name '*.html' -print)
          test -f icon-512.png
          test "$(file icon-512.png | grep -c '512 x 512')" -eq 1
      - name: Check whitespace
        run: git diff --check
      - name: Setup Java 21 for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Firebase Realtime Database rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartfarm-firebase-rules
          cp firebase.rules.json /tmp/smartfarm-firebase-rules/firebase.rules.json
          cat > /tmp/smartfarm-firebase-rules/firebase.json <<'EOF'
          {
            "database": { "rules": "firebase.rules.json" },
            "emulators": { "database": { "port": 9000 } }
          }
          EOF
          (cd /tmp/smartfarm-firebase-rules && npx --yes firebase-tools@15.28.1 emulators:exec --only database --project smart-farm-platfor "echo FIREBASE_RULES_PARSED")

  functions-quality:
    name: Cloud Functions quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Cloud Functions dependencies
        run: npm ci
      - name: Validate Cloud Functions syntax
        run: node --check index.js
      - name: Audit production dependencies
        run: npm audit --omit=dev

  firmware-build:
    name: ESP8266 firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile with Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
      - name: Install libraries
        shell: bash
        run: |
          set -euo pipefail
          install_lib() {
            local spec="$1"
            for attempt in 1 2 3 4; do
              if arduino-cli lib install "$spec"; then
                return 0
              fi
              echo "Library install failed: $spec (attempt $attempt/4); retrying..."
              sleep $((attempt * 5))
            done
            echo "Library install failed permanently: $spec"
            return 1
          }
          install_lib 'WiFiManager@2.0.17'
          install_lib 'PubSubClient@2.8'
          install_lib 'ArduinoJson@6.21.5'
          install_lib 'NTPClient@3.2.1'
          install_lib 'RTClib@2.1.4'
          install_lib 'DHT sensor library@1.4.6'
          install_lib 'Adafruit Unified Sensor'
      - name: Compile current firmware
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p /tmp/smartfarm-sketch build
          cp SmartFarm_V7.2.0_OTA_STABLE.ino /tmp/smartfarm-sketch/smartfarm-sketch.ino
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir build /tmp/smartfarm-sketch
          test -s build/smartfarm-sketch.ino.bin
          (cd build && sha256sum *.bin | tee SHA256SUMS.txt)
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFarm-V7-ESP8266-BIN
          path: |
            build/*.bin
            build/SHA256SUMS.txt
