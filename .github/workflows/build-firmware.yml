name: Build ESP8266 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino'
      - 'platformio.ini'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run dashboard, firmware and MQTT contract tests
        run: |
          node dashboard-contract-test.mjs
          node firmware-v723-contract-test.mjs
          node dashboard-smoke-test.mjs
          python3 tools/test_mqtt_acl_simulation.py
      - name: Prepare Arduino source
        run: mkdir -p src && cp SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino src/main.ino
      - name: Build NodeMCU ESP8266 firmware
        run: pio run -e nodemcuv2
      - name: Copy firmware artifact
        run: cp .pio/build/nodemcuv2/firmware.bin SmartFarm_V7.2.3_REMOTE_WIFI_RESET.bin
      - name: Verify broker hostname and firmware artifact
        run: |
          grep -F '#define SMARTFARM_VERSION "V7.2.3-REMOTE-WIFI-RESET"' SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino
          grep -F 'bool autoMode = false;' SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino
          grep -F 'MQTT_BASE "/wifi/reset/set"' SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino
          grep -F 'clearSavedWifiSettings(F("MQTT WiFi reset confirmed"), true)' SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino
          grep -F '#define MQTT_SERVER "25305924f68c41f2a1e089a1836d3287.s1.eu.hivemq.cloud"' SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino
          grep -F '#define MQTT_PORT 8883' SmartFarm_V7.2.3_REMOTE_WIFI_RESET.ino
          grep -F 'platform = espressif8266@4.2.0' platformio.ini
          test -s SmartFarm_V7.2.3_REMOTE_WIFI_RESET.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFarm_V7.2.3_REMOTE_WIFI_RESET
          path: SmartFarm_V7.2.3_REMOTE_WIFI_RESET.bin
          if-no-files-found: error
          retention-days: 30
