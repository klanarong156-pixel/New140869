name: Build ESP8266 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartFarm_V7.4.0_WDT_DIAGNOSTICS.ino'
      - 'firmware-v740-resilience-test.mjs'
      - 'platformio.ini'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run firmware resilience contract tests
        run: node firmware-v740-resilience-test.mjs
      - name: Install PlatformIO
        run: pip install platformio
      - name: Prepare Arduino source
        run: mkdir -p src && cp SmartFarm_V7.4.0_WDT_DIAGNOSTICS.ino src/main.ino
      - name: Build NodeMCU ESP8266 firmware
        run: pio run -e nodemcuv2
      - name: Copy firmware artifact
        run: cp .pio/build/nodemcuv2/firmware.bin SmartFarm_V7.4.0_WDT_DIAGNOSTICS.bin
      - name: Verify broker hostname and firmware artifact
        run: |
          grep -F '#define SMARTFARM_VERSION "V7.4.0-OTA-STABLE"' SmartFarm_V7.4.0_WDT_DIAGNOSTICS.ino
          grep -F '#define MQTT_SERVER "25305924f68c41f2a1e089a1836d3287.s1.eu.hivemq.cloud"' SmartFarm_V7.4.0_WDT_DIAGNOSTICS.ino
          grep -F '#define MQTT_PORT 8883' SmartFarm_V7.4.0_WDT_DIAGNOSTICS.ino
          grep -F 'platform = espressif8266@4.2.0' platformio.ini
          test -s SmartFarm_V7.4.0_WDT_DIAGNOSTICS.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFarm_V7.4.0_WDT_DIAGNOSTICS
          path: SmartFarm_V7.4.0_WDT_DIAGNOSTICS.bin
          if-no-files-found: error
          retention-days: 30
