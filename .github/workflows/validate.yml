name: Validate Smart Farm integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: Dashboard, firmware, and Firebase checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.54.1

      - name: Install Chrome for browser integration test
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run static and integration regression checks
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node dashboard-smoke-test.mjs
          node dashboard-contract-test.mjs
          node cucumber-sales-regression-test.mjs
          node auth-expiry-regression-test.mjs
          node schedule-regression-test.mjs
          node usage-reset-calculation-test.mjs
          node ai-advisor-regression-test.mjs
          node firmware-logic-regression-test.mjs
          node e2e-navigation-test.mjs
          node dashboard-browser-smoke.mjs
          node tools/settings-mqtt-e2e.mjs
          npm --prefix functions run lint
          python3 tools/mqtt_contract_audit.py
          python3 tools/test_mqtt_acl_simulation.py
          git diff --check

  deploy-hosting:
    name: Deploy Firebase Hosting (production)
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Firebase service-account secret is configured
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_FARM_PLATFOR }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Required repository secret FIREBASE_SERVICE_ACCOUNT_SMART_FARM_PLATFOR is not configured.'
            exit 1
          fi
          echo 'Firebase Hosting service-account secret is configured.'

      - name: Deploy live Hosting site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_FARM_PLATFOR }}
          projectId: smart-farm-platfor
          channelId: live
          firebaseToolsVersion: 15.28.1
