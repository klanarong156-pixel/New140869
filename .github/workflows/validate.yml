name: Agri Ledger validation and hosting deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate accounting app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check accounting-core.js
          node --check accounting-store.js
          node --check accounting.js
          node --check auth-page.js
          node --check firebase.js
          node --check sw.js
      - name: Run accounting domain tests
        run: node --test test/accounting-core.test.mjs
      - name: Validate JSON and rules twin
        run: |
          set -euo pipefail
          python3 -m json.tool firebase.json >/dev/null
          python3 -m json.tool firebase.rules.json >/dev/null
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool manifest.json >/dev/null
          cmp -s firebase.rules.json database.rules.json
      - name: Check local browser assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  for key in ('src','href'):
                      ref=values.get(key,'')
                      if ref and not ref.startswith(('http:','https:','data:','#','mailto:','javascript:')):
                          self.refs.append(ref)
          for name in ('index.html','auth.html'):
              parser=Assets(); parser.feed(Path(name).read_text(encoding='utf-8'))
              for ref in parser.refs:
                  path=urlsplit(ref).path
                  if path and not Path(path).exists():
                      raise SystemExit(f'{name}: missing asset {ref}')
          print('Local browser assets: PASS')
          PY
      - name: Check whitespace
        run: git diff --check

  deploy-hosting:
    name: Deploy Firebase Hosting
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify Firebase service account is configured
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_FARM_PLATFOR }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Firebase Hosting service-account secret is not configured.'
            exit 1
          fi
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_FARM_PLATFOR }}
          projectId: smart-farm-platfor
          channelId: live
          firebaseToolsVersion: 15.28.1
