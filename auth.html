<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="เข้าสู่ระบบสวนลุงนะ Smart Farm Dashboard"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#087b50"><title>เข้าสู่ระบบ · Smart Farm Dashboard</title>  <link rel="stylesheet" href="readability-overhaul.css?v=1">

</head>
<body>
  <main class="auth-layout">
    <section class="card auth-card" aria-labelledby="authTitle"><p class="kicker">DASHBOARD V7.1 · FARM ACCOUNT</p><h1 id="authTitle">เข้าสู่ Dashboard ใหม่</h1><p id="authDescription" class="subtitle">เข้าสู่ระบบเพื่อจัดการอุปกรณ์ รอบปลูก การเงิน และการแจ้งเตือน Telegram</p><div class="auth-switch" role="group" aria-label="ประเภทการใช้งานบัญชี"><button type="button" data-auth-mode="signin" aria-pressed="true">เข้าสู่ระบบ</button><button type="button" data-auth-mode="signup" aria-pressed="false">สร้างบัญชี</button></div><form id="authForm" class="form-grid" aria-describedby="authDescription"><div class="field full"><label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field full"><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" aria-describedby="passwordHint" required minlength="6" placeholder="••••••••"><span id="passwordHint" class="field-note"></span></div><div id="authStatus" class="notice hidden" role="status" aria-live="polite" aria-atomic="true"></div><div class="field full"><button id="authSubmit" class="btn primary block" type="submit">เข้าสู่ระบบ</button></div></form><p class="helper" style="margin-top:16px">แดชบอร์ดควบคุมอุปกรณ์ยังเปิดดูได้ที่ <a href="index.html">หน้าแรก</a></p></section>
  </main>
  <script src="firebase.js?v=11"></script><script src="auth-page.js?v=8"></script>
</body>
</html>
