<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>สวนลุงนะ • Login</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><h1>สวนลุงนะ Smart Farm</h1><p>เข้าสู่ระบบเพื่อใช้งานข้อมูลฟาร์มและบัญชี</p></header><section class="controls"><h2 id="title">เข้าสู่ระบบ</h2><label>อีเมล <input id="email" type="email" autocomplete="email"></label><label>รหัสผ่าน <input id="password" type="password" autocomplete="current-password"></label><button id="submit" onclick="submitAuth()">เข้าสู่ระบบ</button><button onclick="toggleMode()" style="background:#ffffff12">สร้างบัญชีใหม่</button><p id="msg"></p></section></main><script src="firebase.js"></script><script>let signup=false;function toggleMode(){signup=!signup;document.getElementById('title').textContent=signup?'สร้างบัญชี':'เข้าสู่ระบบ';document.getElementById('submit').textContent=signup?'สมัครสมาชิก':'เข้าสู่ระบบ';document.getElementById('msg').textContent=''}async function submitAuth(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('msg');if(!email||password.length<6){msg.textContent='กรุณากรอกอีเมลและรหัสผ่านอย่างน้อย 6 ตัวอักษร';return}try{if(signup)await FirebaseAuth.signUp(email,password);else await FirebaseAuth.signIn(email,password);location.href='index.html'}catch(e){msg.textContent=e.message}}if(FirebaseAuth.user)location.href='index.html';</script></body></html>
